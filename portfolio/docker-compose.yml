
services:
  web:
    build: ./dockers/web/
    # container_name: php-apache
    ports:
      - 8080:80
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    # image: mysql:8.0
    # container_name: mysql-db
    build: ./dockers/db/
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - 3306:3306

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    # container_name: phpmyadmin
    restart: always
    ports:
      - 8082:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: example
volumes:
  db_data:
